name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck -x bin/my_claude lib/my_claude/doctor.sh install.sh uninstall.sh tests/smoke.sh tests/fakebin/claude
      - name: smoke tests
        run: bash tests/smoke.sh
