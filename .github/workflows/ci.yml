name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck -x bin/my_claude lib/doctor.sh install.sh uninstall.sh tests/smoke.sh tests/fakebin/claude tests/fakebin/uv
      - name: unit tests
        run: python3 tests/test_sync.py
      - name: smoke tests
        run: bash tests/smoke.sh
